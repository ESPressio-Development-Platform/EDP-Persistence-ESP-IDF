[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32.git#d41d8383706dc146fd91a0e1d3c59a915a4d493e
board = esp32dev
framework = espidf
monitor_speed = 115200
board_build.partitions = partitions.csv
board_build.flash_size = 2MB

build_flags =
    -std=gnu++20
    -I../../../src
    -I../../../../EDP-Persistence/src
    -I../../../../EDP-Memory/src
    -I../../../../EDP-Platform/src
    -I../../../../EDP-Platform-Portable/src
    -I../../../../EDP-System/src
