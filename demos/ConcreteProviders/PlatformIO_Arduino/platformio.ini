[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200

build_unflags =
    -std=gnu++11

build_flags =
    -std=gnu++20
    -I../../../src
    -I../../../../EDP-Persistence/src
    -I../../../../EDP-Memory/src
    -I../../../../EDP-Platform/src
    -I../../../../EDP-Platform-Portable/src
    -I../../../../EDP-System/src
